[project]
name = "datalens-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1", "pydantic-settings>=2.11,<3", "python-multipart>=0.0.20,<1", "pandas>=2.3,<3", "numpy>=2.3,<3", "duckdb>=1.4,<2", "scipy>=1.16,<2", "httpx>=0.28,<1", "charset-normalizer>=3.4,<4"]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 110
